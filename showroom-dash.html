<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showroom Dash</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1878b8; --ink: #ffffff; --panel: rgba(8, 40, 70, .78); --accent: #ffd34d;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f5a8e; } }
  :root[data-theme="dark"] { --bg: #0f5a8e; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Rubik, "Segoe UI", system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 16px; right: 16px; display: flex; justify-content: space-between; font-weight: 800; font-size: 1.5rem; letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0,0,0,.35); pointer-events: none; }
  #hud span { font-size: .9rem; font-weight: 500; opacity: .85; display: block; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 30, 55, .55); backdrop-filter: blur(3px); }
  .overlay.hidden { display: none; }
  .card { background: var(--panel); padding: 28px 32px; border-radius: 18px; text-align: center; max-width: 340px; width: 88vw; }
  .card h1 { font-size: 2.2rem; font-weight: 800; line-height: 1; margin-bottom: 8px; }
  .card p { font-size: .95rem; line-height: 1.45; opacity: .9; margin-bottom: 18px; }
  .card .big { font-size: 3rem; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
  button { font: inherit; font-weight: 800; font-size: 1.05rem; padding: 12px 28px; border: 0; border-radius: 999px; background: var(--accent); color: #1a2a3a; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .overlay { backdrop-filter: none; } }
</style>
</head>
<body>
<div id="hud"><div id="score">0<span>score</span></div><div id="best">0<span>best</span></div></div>
<div id="start" class="overlay"><div class="card">
  <h1>Showroom Dash</h1>
  <p>Dodge the boxes, grab the gadgets.<br>Arrow keys / A D to switch lanes, Space or ↑ to jump. On phone, swipe.</p>
  <button id="play">Start running</button>
</div></div>
<div id="over" class="overlay hidden"><div class="card">
  <div class="big" id="final">0</div>
  <p id="msg">Crashed into the stockroom.</p>
  <button id="again">Run again</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  const head = new THREE.Group(); head.position.y = 3.15; player.add(head);
  const faceTex = new THREE.CanvasTexture(document.createElement('canvas')); faceTex.encoding = THREE.sRGBEncoding;
  const img = new Image();
  img.onload = () => {
    const c = faceTex.image, R = 256; c.width = c.height = R * 2;
    const g = c.getContext('2d');
    g.beginPath(); g.arc(R, R, R - 6, 0, Math.PI * 2); g.closePath(); g.clip();
    g.drawImage(img, 0, 0, img.width, img.height, 0, 0, R * 2, R * 2);
    faceTex.needsUpdate = true;
  };
  img.src = "data:image/jpeg;base64," + FACE;
  const faceMat = new THREE.MeshStandardMaterial({ map: faceTex, transparent: true, alphaTest: .5, roughness: .6, side: THREE.DoubleSide });
  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.45, 1.45), faceMat); face.castShadow = true; head.add(face);
  const ring = new THREE.Mesh(new THREE.CircleGeometry(.76, 48), M(0xffffff)); ring.position.z = -.02; head.add(ring);
  const ringBack = new THREE.Mesh(new THREE.CircleGeometry(.76, 48), M(0x1d1511)); ringBack.position.z = -.03; ringBack.rotation.y = Math.PI; head.add(ringBack);
  const armL = box(.3, 1.05, .3, navy), armR = armL.clone();
  armL.position.set(-.72, 1.7, 0); armR.position.set(.72, 1.7, 0);
  const handL = box(.24, .2, .24, skin), handR = handL.clone(); handL.position.y = -.6; handR.position.y = -.6;
  armL.add(handL); armR.add(handR);
  const legL = box(.4, 1.1, .4, trouser), legR = legL.clone();
  legL.position.set(-.27, .55, 0); legR.position.set(.27, .55, 0);
  const shL = box(.42, .18, .5, shoe), shR = shL.clone(); shL.position.set(0, -.55, .05); shR.position.set(0, -.55, .05);
  legL.add(shL); legR.add(shR);
  [armL, armR, legL, legR].forEach(p => { p.geometry.translate(0, -.5, 0); p.position.y += .5; });
  player.add(armL, armR, legL, legR);
  player.scale.setScalar(.75);
  scene.add(player);

  // ---- Obstacles & pickups ----
  const cardboard = M(0xc69c6d), tape = M(0xa87d4c);
  const gadgetMats = [M(0x16202c, { roughness: .3, metalness: .5 }), M(0xf0f0f0, { roughness: .4 }), M(0xd63b3b)];
  const items = []; // {mesh, type, lane}
  function spawnRow(z) {
    const open = Math.floor(Math.random() * 3);
    for (let l = 0; l < 3; l++) {
      if (l === open) {
        if (Math.random() < .6) {
          const g = new THREE.Group();
          const kind = Math.floor(Math.random() * 3);
          if (kind === 0) { const t = box(.9, .55, .06, gadgetMats[0]); t.position.y = .3; g.add(t); }
          else if (kind === 1) { g.add(box(.5, .5, .4, gadgetMats[1])); }
          else { const p = box(.3, .6, .12, gadgetMats[2]); p.position.y = .3; g.add(p); }
          g.position.set(LANES[l], 1, z); g.userData = { type: 'gadget', lane: l, spin: Math.random() * 6 };
          scene.add(g); items.push(g);
        }
        continue;
      }
      if (Math.random() < .55) {
        const tall = Math.random() < .3;
        const g = new THREE.Group();
        const b = box(1.3, tall ? 2.2 : 1, 1.3, cardboard); b.position.y = tall ? 1.1 : .5; g.add(b);
        const t = box(.3, (tall ? 2.2 : 1) + .02, 1.32, tape); t.position.y = b.position.y; g.add(t);
        g.position.set(LANES[l], 0, z); g.userData = { type: 'box', lane: l, tall };
        scene.add(g); items.push(g);
      }
    }
  }

  // ---- State ----
  const S = { lane: 1, x: 0, y: 0, vy: 0, speed: 0, score: 0, running: false, t: 0, nextZ: -20 };
  const scoreEl = document.getElementById('score').firstChild;
  const startOv = document.getElementById('start'), overOv = document.getElementById('over');

  function reset() {
    items.forEach(i => scene.remove(i)); items.length = 0;
    Object.assign(S, { lane: 1, x: 0, y: 0, vy: 0, speed: 11, score: 0, running: true, t: 0, nextZ: -20 });
    player.position.set(0, 0, 0); player.rotation.set(0, 0, 0);
    scoreEl.nodeValue = '0';
  }
  function gameOver() {
    S.running = false;
    const sc = Math.floor(S.score);
    if (sc > best) { best = sc; document.getElementById('best').firstChild.nodeValue = best; try { localStorage.setItem('showroom-best', best); } catch (e) {} }
    document.getElementById('final').textContent = sc;
    document.getElementById('msg').textContent = sc >= best && sc > 0 ? 'New personal best.' : 'Crashed into the stockroom.';
    overOv.classList.remove('hidden');
  }
  const move = d => { if (S.running) S.lane = Math.max(0, Math.min(2, S.lane + d)); };
  const jump = () => { if (S.running && S.y < .01) S.vy = 9.5; };
  addEventListener('keydown', e => {
    if (['ArrowLeft', 'a', 'A'].includes(e.key)) move(-1);
    else if (['ArrowRight', 'd', 'D'].includes(e.key)) move(1);
    else if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) { e.preventDefault(); jump(); }
  });
  let tx = 0, ty = 0;
  addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1);
    else if (dy < -30) jump();
  }, { passive: true });
  document.getElementById('play').onclick = () => { startOv.classList.add('hidden'); reset(); };
  document.getElementById('again').onclick = () => { overOv.classList.add('hidden'); reset(); };

  // ---- Loop ----
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), .05);
    if (S.running) {
      S.t += dt;
      S.speed += dt * .35;
      S.score += dt * S.speed;
      scoreEl.nodeValue = Math.floor(S.score);
      const dz = S.speed * dt;
      // move world
      for (const sh of shelves) { sh.position.z += dz; if (sh.position.z > 10) sh.position.z -= 98; }
      S.nextZ += dz;
      if (S.nextZ > -10) { spawnRow(-45); S.nextZ = -45 + Math.max(5, 10 - S.speed * .15); }
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i]; it.position.z += dz;
        if (it.userData.type === 'gadget') { it.rotation.y += dt * 3; it.position.y = 1 + Math.sin(S.t * 4 + it.userData.spin) * .12; }
        if (it.position.z > 10) { scene.remove(it); items.splice(i, 1); continue; }
        if (Math.abs(it.position.z) < .8 && it.userData.lane === S.lane) {
          if (it.userData.type === 'gadget') {
            if (Math.abs(S.y - (it.position.y - .8)) < 1.2) { S.score += 50; scene.remove(it); items.splice(i, 1); }
          } else if (S.y < (it.userData.tall ? 5 : 1.0)) { gameOver(); }
        }
      }
      // player physics
      S.vy -= 28 * dt; S.y = Math.max(0, S.y + S.vy * dt); if (S.y === 0) S.vy = 0;
      S.x += (LANES[S.lane] - S.x) * Math.min(1, dt * 14);
      player.position.set(S.x, S.y, 0);
      player.rotation.z = (LANES[S.lane] - S.x) * -.15;
      const run = Math.sin(S.t * 14) * .9, air = S.y > 0;
      legL.rotation.x = air ? -.5 : run; legR.rotation.x = air ? .4 : -run;
      armL.rotation.x = air ? -2.2 : -run; armR.rotation.x = air ? -2.2 : run;
      torso.position.y = 1.65 + (air ? 0 : Math.abs(Math.cos(S.t * 14)) * .05);
      camera.position.x += (S.x * .4 - camera.position.x) * dt * 5;
    } else {
      const idle = Math.sin(performance.now() / 500) * .04;
      player.position.y = idle; player.rotation.y = Math.sin(performance.now() / 1800) * .25;
    }
    head.quaternion.copy(player.quaternion).invert().multiply(camera.quaternion);
    renderer.render(scene, camera);
  }
  frame();
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
})();
